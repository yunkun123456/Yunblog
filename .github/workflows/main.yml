# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: 自动部署到生产环境

on:
  push:
    branches:
      - master  # 当推送到master分支时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v3

      # 2. 设置 Java 环境
      - name: 设置 Java 环境
        uses: actions/setup-java@v3
        with:
          java-version: '21'  # 与项目配置保持一致
          distribution: 'temurin'
      # 3. 编译项目
      - name: 编译项目
        run: mvn clean package

      # 4. 上传JAR包到服务器
      - name: 上传JAR包到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 124.223.115.240              # 服务器 IP
          username: ${{ secrets.SERVER_USER }} # 引用 GitHub Secrets 中的用户名
          password: ${{ secrets.SERVER_PASS }} # 引用 GitHub Secrets 中的密码
          source: "./yunblog-admin/target/yunblog-admin-0.0.1-SNAPSHOT.jar"
          target: /opt/workspace/yunblog-backend/  # 上传到服务器的目标目录
          overwrite: true  # 文件覆盖模式

      # 5. 停止旧服务并启动新服务
      - name: 重启服务
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 124.223.115.240              # 服务器 IP
          username: ${{ secrets.SERVER_USER }} # 引用 GitHub Secrets 中的用户名
          password: ${{ secrets.SERVER_PASS }} # 引用 GitHub Secrets 中的密码
          script: |
            cd /opt/workspace/yunblog-backend/

            # 停止旧的Java进程
            pid=$(ps -ef | grep yunblog-admin-0.0.1-SNAPSHOT.jar | grep -v grep | awk '{print $2}')
            if [ -n "$pid" ]; then
              echo "停止旧服务进程: $pid"
              kill -9 $pid
              sleep 2
            fi

            # 启动新服务（注意：服务器需要安装 Java 21）
            echo "启动新服务..."
            nohup java -jar yunblog-admin-0.0.1-SNAPSHOT.jar > nohup.out 2>&1 &

            # 等待服务启动
            sleep 5

            # 检查服务是否启动成功
            if ps -ef | grep yunblog-admin-0.0.1-SNAPSHOT.jar | grep -v grep > /dev/null; then
              echo "服务启动成功！"
            else
              echo "服务启动失败！"
              exit 1
            fi
