sa-token:
  # token 名称
  token-name: yunblog
  # 会话保存10天
  timeout: 864000
  # token 最低活跃频次，-1表示不限制
  active-timeout: -1
  # 允许同一时间多地登录账号
  is-concurrent: true
  # 允许多人登录同一账号
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出日志
  is-log: true
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yunblog_local?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&zeroDateTimeBehavior=convertToNull
    username: root
    password: 1234

  data:
    redis:
      host: localhost
      port: 6379
      # 本地redis缓存，占用10库
      database: 10

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    com.ssj.yunblog.baseInfo.dao: debug

file:
  service:
    path:
      root-path: doc/