server:
  port: 10251
sa-token:
  # token 名称
  token-name: yunblog
  # 会话保存10天
  timeout: 864000
  # token 最低活跃频次，-1表示不限制
  active-timeout: -1
  # 允许同一时间多地登录账号
  is-concurrent: true
  # 允许多人登录同一账号
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出日志
  is-log: true
